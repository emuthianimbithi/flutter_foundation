name: foundation_bootstrap
description: Single entrypoint to wire Flutter Foundation packages (config, storage, networking, auth, routing, payments).
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  riverpod: ^2.6.1
  go_router: ^14.2.0
  foundation_core:
    path: ../foundation_core
  foundation_config:
    path: ../foundation_config
  foundation_storage:
    path: ../foundation_storage
  foundation_networking:
    path: ../foundation_networking
  foundation_auth:
    path: ../foundation_auth
  foundation_routing:
    path: ../foundation_routing
  foundation_payments:
    path: ../foundation_payments

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
