name: foundation_sync
description: Offline-first sync engine with conflict resolution for Flutter Foundation.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  
  foundation_core:
    path: ../foundation_core
  foundation_storage:
    path: ../foundation_storage
  
  # Riverpod
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  
  # Connectivity
  connectivity_plus: ^6.0.2
  
  # Background execution
  workmanager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  mocktail: ^1.0.3
