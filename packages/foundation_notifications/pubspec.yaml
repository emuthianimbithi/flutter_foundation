name: foundation_notifications
description: Push + local notifications foundation (FCM + routing) with Riverpod.
version: 0.1.0
homepage: https://example.com
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  firebase_messaging: ^15.0.0
  flutter_local_notifications: ^17.2.2
  permission_handler: ^11.3.1

  foundation_core:
    path: ../foundation_core
  foundation_config:
    path: ../foundation_config

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.10
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
