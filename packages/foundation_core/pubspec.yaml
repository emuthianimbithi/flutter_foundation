name: foundation_core
description: Core utilities, types, and extensions for Flutter Foundation packages.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Functional programming utilities
  fpdart: ^1.1.0
  
  # Riverpod for state management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  
  # Logging
  logger: ^2.2.0
  
  # Equatable for value equality
  equatable: ^2.0.5
  
  # UUID generation
  uuid: ^4.3.3
  
  # Intl for date/number formatting
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  mocktail: ^1.0.3
