name: foundation_networking
description: Networking layer for Flutter Foundation - gRPC, REST, WebSocket, MQTT, GraphQL, Firestore.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  
  foundation_core:
    path: ../foundation_core
  foundation_config:
    path: ../foundation_config
  foundation_storage:
    path: ../foundation_storage
  
  # Riverpod
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  
  # gRPC
  grpc: ^3.2.4
  protobuf: ">=3.1.0 <7.0.0"
  
  # REST (Dio)
  dio: ^5.4.1
  retrofit: ^4.1.0
  
  # WebSocket
  web_socket_channel: ^3.0.0
  
  # MQTT
  mqtt_client: ^10.2.1
  
  # GraphQL
  graphql: ^5.1.3
  
  # Firebase/Firestore
  cloud_firestore: ^5.0.0
  firebase_core: ^3.0.0
  
  # Connectivity
  connectivity_plus: ^6.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  retrofit_generator: ^8.1.0
  riverpod_generator: ^2.4.0
  mocktail: ^1.0.3
