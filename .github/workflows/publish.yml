name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g., 1.0.0)"
        required: true
      packages:
        description: "Packages to publish (comma-separated, or 'all')"
        required: false
        default: "all"

env:
  FLUTTER_VERSION: "3.24.0"

jobs:
  # ─────────────────────────────────────────────────────────────
  # VALIDATE
  # ─────────────────────────────────────────────────────────────
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Melos
        run: dart pub global activate melos

      - name: Bootstrap
        run: melos bootstrap

      - name: Run CI checks
        run: melos run ci

  # ─────────────────────────────────────────────────────────────
  # VERSION PACKAGES
  # ─────────────────────────────────────────────────────────────
  version:
    name: Version Packages
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Melos
        run: dart pub global activate melos

      - name: Bootstrap
        run: melos bootstrap

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Version packages
        run: |
          melos version \
            --yes \
            --no-git-tag-version \
            --message="chore: release v${{ needs.validate.outputs.version }}"

      - name: Push changes
        run: |
          git push origin HEAD:main
          git push --tags

  # ─────────────────────────────────────────────────────────────
  # CREATE GITHUB RELEASE
  # ─────────────────────────────────────────────────────────────
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [validate, version]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          # Get commits since last tag
          LAST_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            CHANGELOG=$(git log $LAST_TAG..HEAD --pretty=format:"- %s (%h)" --no-merges)
          else
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --no-merges -20)
          fi
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.validate.outputs.version }}
          name: Release v${{ needs.validate.outputs.version }}
          body: |
            ## Changes
            
            ${{ steps.changelog.outputs.changelog }}
            
            ## Installation
            
            Add to your `pubspec.yaml`:
            
            ```yaml
            dependencies:
              foundation_core:
                git:
                  url: https://github.com/emuthianimbithi/flutter_foundation
                  path: packages/foundation_core
                  ref: v${{ needs.validate.outputs.version }}
            ```
          draft: false
          prerelease: false

  # ─────────────────────────────────────────────────────────────
  # BUILD SHOWCASE RELEASE
  # ─────────────────────────────────────────────────────────────
  build-showcase-release:
    name: Build Showcase Release
    runs-on: ubuntu-latest
    needs: [validate, version]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Melos
        run: dart pub global activate melos

      - name: Bootstrap
        run: melos bootstrap

      - name: Generate code
        run: melos run generate

      - name: Check if showcase exists
        id: check
        run: |
          if [ -d "apps/showcase" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Build release APK
        if: steps.check.outputs.exists == 'true'
        run: |
          cd apps/showcase
          flutter build apk --release

      - name: Upload to release
        if: steps.check.outputs.exists == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.validate.outputs.version }}
          files: |
            apps/showcase/build/app/outputs/flutter-apk/app-release.apk
