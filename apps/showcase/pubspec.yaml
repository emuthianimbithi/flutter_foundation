name: showcase
description: Flutter Foundation Showcase app
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Foundation packages (adjust paths when copied into monorepo)
  foundation_core:
    path: ../../packages/foundation_core
  foundation_config:
    path: ../../packages/foundation_config
  foundation_storage:
    path: ../../packages/foundation_storage
  foundation_networking:
    path: ../../packages/foundation_networking
  foundation_auth:
    path: ../../packages/foundation_auth
  foundation_sync:
    path: ../../packages/foundation_sync
  foundation_routing:
    path: ../../packages/foundation_routing
  foundation_notifications:
    path: ../../packages/foundation_notifications
  foundation_permissions:
    path: ../../packages/foundation_permissions
  foundation_analytics:
    path: ../../packages/foundation_analytics
  foundation_security:
    path: ../../packages/foundation_security
  foundation_i18n:
    path: ../../packages/foundation_i18n
  foundation_ui:
    path: ../../packages/foundation_ui
  foundation_forms:
    path: ../../packages/foundation_forms
  foundation_onboarding:
    path: ../../packages/foundation_onboarding
  foundation_media:
    path: ../../packages/foundation_media
  foundation_device:
    path: ../../packages/foundation_device
  foundation_maps:
    path: ../../packages/foundation_maps
  foundation_calendar:
    path: ../../packages/foundation_calendar
  foundation_chat:
    path: ../../packages/foundation_chat
  foundation_payments:
    path: ../../packages/foundation_payments
  marulla_protos:
    git:
      url: https://github.com/emuthianimbithi/protos.git
      ref: dev
      path: gen/dart/marulla_protos

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
