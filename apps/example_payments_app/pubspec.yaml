name: example_payments_app
description: Demo payments flow using foundation_bootstrap + Stripe demo backend.
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  foundation_bootstrap:
    path: ../../packages/foundation_bootstrap
  foundation_payments:
    path: ../../packages/foundation_payments
  foundation_config:
    path: ../../packages/foundation_config
  foundation_routing:
    path: ../../packages/foundation_routing

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
